name: Investor Desk checks and deployment

on:
  push:
    branches: [main, feat/investor-preview-20260926]
    paths: ['desk/**', 'test/**', 'tools/**', 'static/investors/**', 'package*.json', '.github/workflows/investor-desk.yml']
  pull_request:
    paths: ['desk/**', 'test/**', 'tools/**', 'static/investors/**', 'package*.json', '.github/workflows/investor-desk.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the Worker after required secrets are configured
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx --yes wrangler@4.132.0 deploy --dry-run --config desk/wrangler.jsonc
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency: deploy-enabler-investor-desk
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH_SECRET: ${{ secrets.INVESTOR_AUTH_SECRET }}
      RESEND_API_KEY: ${{ secrets.INVESTOR_RESEND_API_KEY }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.INVESTOR_STRIPE_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check configuration without exposing values
        run: |
          node --input-type=module -e '
            for (const key of ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "AUTH_SECRET", "RESEND_API_KEY", "STRIPE_TEST_SECRET_KEY"]) {
              if (!process.env[key]) throw new Error(`Missing ${key}`);
            }
            if (process.env.AUTH_SECRET.length < 32) throw new Error("AUTH_SECRET too short");
            if (!/^(sk|rk)_test_/.test(process.env.STRIPE_TEST_SECRET_KEY)) throw new Error("Test-mode Stripe key required");
          '
      - name: Deploy Worker and SQLite Durable Objects
        run: npx --yes wrangler@4.132.0 deploy --config desk/wrangler.jsonc
      - name: Configure runtime secrets
        run: |
          node --input-type=module -e 'process.stdout.write(JSON.stringify(Object.fromEntries(["AUTH_SECRET", "RESEND_API_KEY", "STRIPE_TEST_SECRET_KEY"].map(k => [k, process.env[k]]))))' | npx --yes wrangler@4.132.0 secret bulk --config desk/wrangler.jsonc
      - name: Check unauthenticated route
        run: |
          node --input-type=module -e '
            const response = await fetch("https://enablerhq.com/api/investors/session");
            if (response.status !== 401 || (await response.json()).error !== "unauthenticated") throw new Error("API route check failed");
          '
